<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg" cx="68%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#172038" />
      <stop offset="55%" stop-color="#070b17" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>
    <linearGradient id="orbit" x1="8" y1="52" x2="56" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#cbd5e1" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sun" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="52%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
  </defs>

  <!-- Deep-space badge background -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#334155" stroke-opacity="0.55" stroke-width="1.5" />

  <!-- Subtle background stars -->
  <circle cx="13" cy="16" r="1.2" fill="#cbd5e1" fill-opacity="0.75" />
  <circle cx="51" cy="48" r="1.1" fill="#94a3b8" fill-opacity="0.7" />
  <circle cx="24" cy="11" r="0.9" fill="#94a3b8" fill-opacity="0.55" />

  <!-- Tilted orbital ellipse -->
  <ellipse
    cx="32"
    cy="32"
    rx="23.5"
    ry="11"
    transform="rotate(-28 32 32)"
    stroke="url(#orbit)"
    stroke-width="2.4"
  />

  <!-- Perihelion sun & corona -->
  <circle cx="42" cy="26" r="15" fill="url(#corona)" />
  <circle cx="42" cy="26" r="8.2" fill="url(#sun)" />

  <!-- Faceted asteroid riding the orbit -->
  <g transform="translate(18 41) rotate(-18)">
    <polygon points="0,-8.2 7,-2.4 5,6.4 -3.8,7.6 -8.2,0.8 -5.6,-5.8" fill="#e2e8f0" />
    <polygon points="0,-8.2 7,-2.4 0.8,0.6 -5.6,-5.8" fill="#ffffff" />
    <polygon points="7,-2.4 5,6.4 0.8,0.6" fill="#cbd5e1" />
    <polygon points="-5.6,-5.8 0.8,0.6 -3.8,7.6 -8.2,0.8" fill="#64748b" />
  </g>
</svg>
